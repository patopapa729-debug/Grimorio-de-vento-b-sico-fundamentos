
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimório de Vento</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px;
  background:
    radial-gradient(circle at center, #304b5b, #101820 80%);
  color: #e8e6dc;
  font-family: Georgia, serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 680px;
  text-align: center;
}

.book {

  width: 100%;
  min-height: 510px;
  border: 9px solid #59452d;
  border-radius: 8px 18px 18px 8px;
  background: #d8c9a7;
  box-shadow:
    0 15px 45px #000a,
    inset 5px 0 10px #796344;
  overflow: hidden;
  perspective: 1200px;
}

.page {
  min-height: 492px;
  padding: 28px;
  text-align: left;
  color: #342d24;
  background:
    linear-gradient(90deg,
      #bca981,
      #e9ddbd 12%,
      #eee2c3 88%,
      #c7b58e);
  animation: appear .35s ease;
}

.cover {
  min-height: 492px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #dcebf0;
  background:
    radial-gradient(circle, #426a80, #142a3a 75%);
  border: 5px double #b8a477;
}

.cover h1 {
  font-size: clamp(30px, 8vw, 48px);
  letter-spacing: 4px;
  text-shadow: 0 0 15px #8cc8e5;
}

.cover h3 {
  color: #d2e3eb;
}

.cover-symbol {
  font-size: 85px;
  color: #c9e6f1;
  text-shadow: 0 0 20px #8cc8e5;
}

h2 {
  color: #37566a;
  text-align: center;
  font-size: 23px;
  border-bottom: 2px solid #a28b60;
  padding-bottom: 12px;
}

h3 {
  color: #45677b;
  margin-top: 22px;
}

p, li {
  font-size: 15px;
  line-height: 1.7;
}

.magic-word {
  background: #d0dcd7;
  border-left: 4px solid #426d80;
  padding: 12px;
  margin: 12px 0;
  border-radius: 4px;
}

.spell {
  background: #e0d5b9;
  border: 1px solid #a28b60;
  padding: 12px;
  margin: 13px 0;
  border-radius: 6px;
}

.spell strong {
  color: #365a70;
}

.symbol {
  text-align: center;
  font-size: 40px;
  color: #416b83;
}

.page-number {
  text-align: right;
  margin-top: 25px;
  color: #806c4c;
  font-style: italic;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
}

button {
  background: #304e60;
  color: white;
  border: 1px solid #9eb5c1;
  padding: 13px 17px;
  border-radius: 7px;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  background: #52778b;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.counter {
  color: #d5e0e4;
  margin-top: 15px;
  font-size: 14px;
}

@keyframes appear {
  from {
    opacity: .2;
    transform: rotateY(-12deg);
  }
  to {
    opacity: 1;
    transform: rotateY(0);
  }
}

@media(max-width: 480px) {
  .book {
    min-height: 530px;
  }

  .page, .cover {
    min-height: 512px;
  }

  .page {
    padding: 19px;
  }

  h2 {
    font-size: 19px;
  }

  p, li {

  }

  button {

    font-size: 12px;

</style>
</head>

// ===================================
// SISTEMA DE PAGINAÇÃO
// ===================================

let currentPage = -1;
let pageDirection = 1;
let flipping = false;

const pageElement = document.getElementById("page");
const counter = document.getElementById("counter");

function renderPage() {

  if (currentPage === -1) {

    pageElement.className = "cover";

    pageElement.innerHTML = `
      <div class="cover-symbol">༄</div>
      <h1>GRIMÓRIO<br>DE VENTO</h1>
      <h3>Volume I — Fundamentos</h3>
      <p>O conhecimento daqueles que seguem<br>
      o caminho dos ventos.</p>
      <p>✧ Edição dos Aprendizes ✧</p>
    `;

    counter.textContent = "Capa — Grimório de Vento";

  } else {

    const p = pages[currentPage];

    pageElement.className = "page";

    pageElement.innerHTML = `
      <h2>${p.title}</h2>
      ${p.content}
      <div class="page-number">
        Página ${currentPage + 1}
      </div>
    `;

    counter.textContent =
      "Página " + (currentPage + 1) +
      " de " + pages.length;
  }

  document.getElementById("previous").disabled =
    currentPage === -1 || flipping;

  document.getElementById("next").disabled =
    currentPage === pages.length - 1 || flipping;
}

// ===================================
// ANIMAÇÃO DE VIRAR PÁGINAS
// ===================================

function turnPage() {

  if (flipping) return;

  const next = currentPage + pageDirection;

  if (next < -1 || next >= pages.length) return;

  flipping = true;

  document.getElementById("previous").disabled = true;
  document.getElementById("next").disabled = true;

  pageElement.style.transition = "transform .25s ease";

  pageElement.style.transform =
    pageDirection > 0
      ? "rotateY(-15deg)"
      : "rotateY(15deg)";

  setTimeout(() => {

    currentPage = next;

    renderPage();

    pageElement.style.transform = "rotateY(0deg)";

    setTimeout(() => {

      flipping = false;

      document.getElementById("previous").disabled =
        currentPage === -1;

      document.getElementById("next").disabled =
        currentPage === pages.length - 1;

    }, 300);

  }, 250);
}

function nextPage() {
  pageDirection = 1;
  turnPage();
}

function previousPage() {
  pageDirection = -1;
  turnPage();
}

// ===================================
// TECLADO
// ===================================

document.addEventListener("keydown", function(event) {

  if (event.key === "ArrowRight") {
    nextPage();
  }

  if (event.key === "ArrowLeft") {
    previousPage();
  }

});

// INICIAR GRIMÓRIO

renderPage();

</script>
